name: Validate

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.23.0'
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate Wails bindings
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/.gitkeep -Value ''
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wails generate module
      - name: Frontend behavior tests
        working-directory: frontend
        run: pnpm test
      - name: TypeScript check
        working-directory: frontend
        run: pnpm run typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm run lint
      - name: Frontend production build
        working-directory: frontend
        run: pnpm run build
      - name: Go checks with isolated app data
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'auralis-test-home'
          $env:AURALIS_APP_DIR = Join-Path $env:RUNNER_TEMP 'auralis-test-data'
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  race:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Race detector with isolated app data
        env:
          AURALIS_APP_DIR: ${{ runner.temp }}/auralis-test-data
        run: go test -race -tags webkit2_41 ./backend
